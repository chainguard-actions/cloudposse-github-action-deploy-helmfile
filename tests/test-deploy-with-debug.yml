name: Test Deploy with Debug Mode and Extra Values
on:
  workflow_dispatch:
jobs:
  test-deploy-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up a git origin reachable inside the Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: action
        uses: .
        continue-on-error: true
        with:
          cluster: my-cluster
          aws-region: eu-west-1
          helmfile-path: deploy
          helmfile: helmfile.yaml
          operation: deploy
          environment: staging
          gitref-sha: deadbeef
          namespace: staging-ns
          image: myapp
          image-tag: v2.0.0
          debug: 'true'
          release_label_name: app
          values_yaml: |
            replicaCount: 2
            resources:
              limits:
                cpu: 500m
                memory: 256Mi
          helm_version: 3.11.1
          helmfile_version: 0.143.5
          kubectl_version: 1.26.3
          chamber_version: 2.11.1

      - name: Assert action ran with debug and extra values
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action should fail (no real AWS/K8s), but it must have started.
          # We accept 'failure' (expected: no AWS creds) or 'success' (infra available).
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with outcome=$OUTCOME (failure expected without real AWS/K8s)"
