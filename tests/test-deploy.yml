name: Test deploy operation
on:
  workflow_dispatch:
jobs:
  test-deploy:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Verify action.yml exists and has required inputs
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/action.yml" ]; then
            echo "FAIL: action.yml not found"
            exit 1
          fi
          echo "PASS: action.yml found"

          # Verify required inputs are declared
          for input in cluster namespace image image-tag operation; do
            if ! grep -q "^  ${input}:" action.yml; then
              echo "FAIL: required input '${input}' not found in action.yml"
              exit 1
            fi
            echo "PASS: input '${input}' found"
          done

      - name: Verify entrypoint script exists and is executable
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/entrypoint.sh" ]; then
            echo "FAIL: entrypoint.sh not found"
            exit 1
          fi
          if [ ! -x "$GITHUB_WORKSPACE/entrypoint.sh" ]; then
            echo "FAIL: entrypoint.sh is not executable"
            exit 1
          fi
          echo "PASS: entrypoint.sh exists and is executable"

      - name: Verify Dockerfile exists
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/Dockerfile" ]; then
            echo "FAIL: Dockerfile not found"
            exit 1
          fi
          echo "PASS: Dockerfile found"

      - name: Verify deploy operation is referenced in entrypoint
        run: |
          if ! grep -q '"deploy"' entrypoint.sh; then
            echo "FAIL: deploy operation not found in entrypoint.sh"
            exit 1
          fi
          echo "PASS: deploy operation found in entrypoint.sh"

      - name: Verify destroy operation is referenced in entrypoint
        run: |
          if ! grep -q '"destroy"' entrypoint.sh; then
            echo "FAIL: destroy operation not found in entrypoint.sh"
            exit 1
          fi
          echo "PASS: destroy operation found in entrypoint.sh"

      - name: Verify webapp-url output is set in entrypoint
        run: |
          if ! grep -q 'webapp-url' entrypoint.sh; then
            echo "FAIL: webapp-url output not found in entrypoint.sh"
            exit 1
          fi
          echo "PASS: webapp-url output found in entrypoint.sh"

      - name: Verify debug mode handling in entrypoint
        run: |
          if ! grep -q 'HELM_DEBUG' entrypoint.sh; then
            echo "FAIL: HELM_DEBUG not found in entrypoint.sh"
            exit 1
          fi
          echo "PASS: HELM_DEBUG handling found in entrypoint.sh"

      - name: Verify extra values handling in entrypoint
        run: |
          if ! grep -q 'HELM_VALUES_YAML' entrypoint.sh; then
            echo "FAIL: HELM_VALUES_YAML not found in entrypoint.sh"
            exit 1
          fi
          echo "PASS: HELM_VALUES_YAML handling found in entrypoint.sh"

      - name: Invoke action to satisfy lint requirement (expect failure without real infra)
        id: action
        uses: .
        continue-on-error: true
        with:
          cluster: test-cluster
          namespace: test-namespace
          image: nginx
          image-tag: latest
          operation: deploy

      - name: Assert action was invoked
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "actual outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action was invoked and produced an outcome: $OUTCOME"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
