name: Test Deploy HelmFile - Debug Mode with Extra Values
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create dummy helmfile
        run: |
          mkdir -p deploy
          cat > deploy/helmfile.yaml << 'EOF'
          environments:
            staging:
              values: []
          releases: []
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          cluster: staging-cluster
          aws-region: eu-west-1
          helmfile-path: deploy
          helmfile: helmfile.yaml
          operation: deploy
          environment: staging
          namespace: staging-namespace
          image: myapp
          image-tag: "v2.0.0"
          debug: "true"
          release_label_name: release
          values_yaml: |
            replicaCount: 2
            resources:
              limits:
                cpu: 500m
                memory: 512Mi
          url-resource-type: ingress

      - name: Assert action ran (expected to fail without real AWS credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action is expected to fail because there are no real AWS credentials
          # or a real Kubernetes cluster. We verify it ran (not skipped).
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action ran in debug mode (outcome=$OUTCOME)"
