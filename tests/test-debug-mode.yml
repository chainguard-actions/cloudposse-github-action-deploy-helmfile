name: Test Deploy HelmFile - Debug Mode with Extra Values
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create minimal helmfile structure
        run: |
          mkdir -p deploy
          cat > deploy/helmfile.yaml << 'EOF'
          environments:
            staging:
              values: []
          releases: []
          EOF

      - id: action
        uses: .
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: fake-key
          AWS_SECRET_ACCESS_KEY: fake-secret
        with:
          cluster: staging-cluster
          aws-region: eu-west-1
          helmfile-path: deploy
          helmfile: helmfile.yaml
          operation: deploy
          environment: staging
          namespace: staging-namespace
          image: myapp
          image-tag: v1.2.3
          debug: "true"
          gitref-sha: abc1234def5678
          release_label_name: release
          values_yaml: |
            replicaCount: 2
            resources:
              limits:
                cpu: 100m

      - name: Assert action was invoked with debug mode
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action will fail without real AWS/K8s credentials
          # We verify it was at least invoked (not skipped)
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action was invoked with debug mode enabled (outcome: ${{ steps.action.outcome }})"
