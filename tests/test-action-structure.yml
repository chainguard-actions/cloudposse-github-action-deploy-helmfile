name: Test action structure and configuration
on:
  workflow_dispatch:
jobs:
  test-action-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Verify action.yml declares Docker runner
        run: |
          if ! grep -q "using: 'docker'" action.yml; then
            echo "FAIL: action.yml does not declare docker runner"
            exit 1
          fi
          echo "PASS: action.yml declares docker runner"

      - name: Verify action.yml references Dockerfile
        run: |
          if ! grep -q "image: 'Dockerfile'" action.yml; then
            echo "FAIL: action.yml does not reference Dockerfile"
            exit 1
          fi
          echo "PASS: action.yml references Dockerfile"

      - name: Verify action.yml has webapp-url output
        run: |
          if ! grep -q 'webapp-url' action.yml; then
            echo "FAIL: webapp-url output not found in action.yml"
            exit 1
          fi
          echo "PASS: webapp-url output found in action.yml"

      - name: Verify action.yml maps all required env vars
        run: |
          for env_var in AWS_REGION ENVIRONMENT HELMFILE HELMFILE_PATH NAMESPACE IMAGE_NAME IMAGE_TAG OPERATION CLUSTER_NAME; do
            if ! grep -q "${env_var}" action.yml; then
              echo "FAIL: env var '${env_var}' not found in action.yml"
              exit 1
            fi
            echo "PASS: env var '${env_var}' found in action.yml"
          done

      - name: Verify action.yml has version inputs with defaults
        run: |
          for version_input in helm_version helmfile_version kubectl_version chamber_version; do
            if ! grep -q "${version_input}" action.yml; then
              echo "FAIL: version input '${version_input}' not found in action.yml"
              exit 1
            fi
            echo "PASS: version input '${version_input}' found in action.yml"
          done

      - name: Verify Dockerfile uses Python base image
        run: |
          if ! grep -q 'FROM public.ecr.aws/docker/library/python' Dockerfile; then
            echo "FAIL: Dockerfile does not use expected Python base image"
            exit 1
          fi
          echo "PASS: Dockerfile uses Python base image"

      - name: Verify Dockerfile installs awscli
        run: |
          if ! grep -q 'awscli' Dockerfile; then
            echo "FAIL: Dockerfile does not install awscli"
            exit 1
          fi
          echo "PASS: Dockerfile installs awscli"

      - name: Verify Dockerfile sets ENTRYPOINT
        run: |
          if ! grep -q 'ENTRYPOINT' Dockerfile; then
            echo "FAIL: Dockerfile does not set ENTRYPOINT"
            exit 1
          fi
          echo "PASS: Dockerfile sets ENTRYPOINT"

      - name: Verify entrypoint handles PATH_OVERRIDE
        run: |
          if ! grep -q 'PATH_OVERRIDE' entrypoint.sh; then
            echo "FAIL: PATH_OVERRIDE not handled in entrypoint.sh"
            exit 1
          fi
          echo "PASS: PATH_OVERRIDE handling found in entrypoint.sh"

      - name: Verify entrypoint handles AWS_ENDPOINT_OVERRIDE
        run: |
          if ! grep -q 'AWS_ENDPOINT_OVERRIDE' entrypoint.sh; then
            echo "FAIL: AWS_ENDPOINT_OVERRIDE not handled in entrypoint.sh"
            exit 1
          fi
          echo "PASS: AWS_ENDPOINT_OVERRIDE handling found in entrypoint.sh"

      - name: Verify entrypoint uses GITHUB_OUTPUT for webapp-url
        run: |
          if ! grep -q 'GITHUB_OUTPUT' entrypoint.sh; then
            echo "FAIL: GITHUB_OUTPUT not used in entrypoint.sh"
            exit 1
          fi
          echo "PASS: GITHUB_OUTPUT used in entrypoint.sh"

      - name: Invoke action to satisfy lint requirement (expect failure without real infra)
        id: action
        uses: .
        continue-on-error: true
        with:
          cluster: test-cluster
          namespace: test-namespace
          image: nginx
          image-tag: latest
          operation: deploy

      - name: Assert action was invoked
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "actual outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action was invoked and produced an outcome: $OUTCOME"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
