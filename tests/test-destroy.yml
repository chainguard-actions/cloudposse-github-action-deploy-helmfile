name: Test destroy operation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Invoke action with destroy operation
        id: action
        uses: .
        continue-on-error: true
        with:
          cluster: my-test-cluster
          aws-region: us-east-1
          helmfile-path: deploy
          helmfile: helmfile.yaml
          operation: destroy
          environment: preview
          namespace: test-namespace
          image: nginx
          image-tag: "1.25.0"
          debug: "false"
          release_label_name: release

      - name: Assert action was invoked for destroy
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "Action outcome: $OUTCOME"
          # The action is expected to fail at AWS authentication in a test environment
          # without real credentials. We verify it was invoked (not skipped).
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to be invoked"
            exit 1
          fi
          echo "PASS: action was invoked with destroy operation (outcome: $OUTCOME)"
