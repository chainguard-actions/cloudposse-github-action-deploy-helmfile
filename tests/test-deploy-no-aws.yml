name: Test deploy operation fails without AWS credentials
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run deploy action (expect failure - no AWS credentials)
        id: action
        uses: .
        continue-on-error: true
        with:
          cluster: test-cluster
          aws-region: us-east-1
          helmfile-path: deploy
          helmfile: helmfile.yaml
          operation: deploy
          environment: preview
          namespace: test-namespace
          image: nginx
          image-tag: latest
          debug: "false"

      - name: Assert action failed due to missing AWS credentials
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail without AWS credentials, but got: ${{ steps.action.outcome }}"
            exit 1
          fi
          echo "PASS: action correctly failed without AWS credentials"
