name: Test input validation and action invocation
on:
  workflow_dispatch:
jobs:
  test-input-validation:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Invoke action with required inputs (expect failure without real cluster)
        id: action
        uses: .
        continue-on-error: true
        with:
          cluster: test-cluster
          namespace: test-namespace
          image: nginx
          image-tag: latest
          operation: deploy
          environment: preview
          aws-region: us-east-1
          helmfile-path: deploy
          helmfile: helmfile.yaml
          debug: "false"

      - name: Assert action was invoked (outcome is failure without real infra)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "actual outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action was invoked and produced an outcome: $OUTCOME"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
