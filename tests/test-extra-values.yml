name: Test extra helm values input is accepted
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with extra values_yaml (expect failure - no AWS credentials)
        id: action
        uses: .
        continue-on-error: true
        with:
          cluster: test-cluster
          aws-region: us-east-1
          helmfile-path: deploy
          helmfile: helmfile.yaml
          operation: deploy
          environment: preview
          namespace: test-namespace
          image: myapp
          image-tag: v2.0.0
          debug: "false"
          values_yaml: |
            replicaCount: 2
            resources:
              limits:
                cpu: 100m
                memory: 128Mi

      - name: Assert action failed due to missing AWS credentials (not input error)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail without AWS credentials, but got: ${{ steps.action.outcome }}"
            exit 1
          fi
          echo "PASS: action correctly failed without AWS credentials (values_yaml input accepted)"
