name: Test Deploy HelmFile - Debug Mode and Extra Values
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test that debug mode and values_yaml inputs are accepted.
      # The action will fail at AWS authentication since no real credentials
      # are available in the test environment.
      - id: action
        uses: .
        continue-on-error: true
        with:
          cluster: my-eks-cluster
          aws-region: eu-west-1
          helmfile-path: deploy
          helmfile: helmfile.yaml
          operation: deploy
          environment: staging
          namespace: my-app-staging
          image: myapp
          image-tag: sha-abc1234
          debug: 'true'
          release_label_name: app
          url-resource-type: ingress
          values_yaml: |
            replicaCount: 2
            resources:
              limits:
                cpu: 500m
                memory: 256Mi

      - name: Assert action ran with debug and values_yaml inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because there are no AWS credentials,
          # not because of missing/invalid inputs (debug + values_yaml).
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (unexpected but acceptable)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected (no AWS credentials in test environment)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS"
