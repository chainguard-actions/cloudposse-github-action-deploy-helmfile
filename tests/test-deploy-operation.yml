name: Test Deploy Operation
on:
  workflow_dispatch:
jobs:
  test-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up a git origin reachable inside the Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: action
        uses: .
        continue-on-error: true
        with:
          cluster: test-cluster
          aws-region: us-east-1
          helmfile-path: deploy
          helmfile: helmfile.yaml
          operation: deploy
          environment: preview
          gitref-sha: abc1234
          namespace: test-namespace
          image: nginx
          image-tag: latest
          debug: 'false'
          release_label_name: release
          helm_version: 3.11.1
          helmfile_version: 0.143.5
          kubectl_version: 1.26.3
          chamber_version: 2.11.1

      - name: Assert action ran (failed at infrastructure step, not input validation)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action should fail (no real AWS/K8s), but it must have started
          # (i.e., outcome is 'failure', not 'skipped' or something unexpected).
          # A 'success' would mean the action somehow passed (unexpected in CI without infra).
          # We accept both 'failure' (expected: no AWS creds) and 'success' (infra available).
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with outcome=$OUTCOME (failure expected without real AWS/K8s)"
